name: macOS build with Nuitka

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'macOS Nuitka'

jobs:
  build:
    runs-on: macos-latest
    steps:
    # Checkout repository
    - uses: actions/checkout@v4

    # Setup Python
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13' # Version range or exact version of a Python version to use, using SemVer's version range syntax
        architecture: 'x86' # optional x64 or x86. Defaults to x64 if not specified
        cache: 'pip'
        cache-dependency-path: |
            **/requirements*.txt

    - name: Install Dependencies
      run: |
          pip install -r src/requirements.txt

    # Build python script into a single executable
    - uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: develop
        script-name: QtTinySA.py
        working-directory: ./src

    # Uploads artifact
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QtTinySA_macos
        path: ./src/build

